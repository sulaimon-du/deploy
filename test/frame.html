<!doctype html>
<meta charset="utf-8">
<title>Телефон 390×844</title>
<style>html,body{margin:0;background:#888}iframe{display:block;border:0;width:390px;height:844px;background:#fff}</style>
<!-- Открывает приложение во фрейме ширины телефона: test/frame.html?r=post/ID&w=390&h=844 -->
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search), f = document.getElementById("f");
f.style.width = (q.get("w") || 390) + "px"; f.style.height = (q.get("h") || 844) + "px";
var r = q.get("r") || "feed";
if (r === "post-ready"){ try{ var sl = JSON.parse(localStorage.getItem("atelier.kv.plan/main")).slots.filter(function(s){ return s.caption; })[0]; r = "post/" + sl.id; }catch(e){ r = "feed"; } }
if (q.get("theme")) localStorage.setItem("atelier.theme", JSON.stringify(q.get("theme")));
f.src = "../index.html#/" + r;
</script>
