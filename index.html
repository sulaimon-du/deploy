<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try{var t=JSON.parse(localStorage.getItem("atelier.theme")||'""');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>
<div id="app">
  <nav class="nav" id="nav" aria-label="Разделы">
    <span class="brand-mark">Ателье <em>карточек</em></span>
    <a href="#/feed" data-nav="feed"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Лента</span></a>
    <a href="#/ideas" data-nav="ideas"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg><span>Идеи</span></a>
    <a href="#/chat" data-nav="chat"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Чат</span></a>
    <button type="button" class="plus" data-act="openCreate" aria-label="Создать"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg><span>Создать</span></button>
    <a href="#/growth" data-nav="growth"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Рост</span></a>
    <a href="#/profile" data-nav="profile"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Профиль</span></a>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="jsErrorBanner" hidden></div>
<noscript><p style="padding:20px">Для работы приложения включите JavaScript.</p></noscript>

<script>
(function(){
  function show(msg){
    var b = document.getElementById("jsErrorBanner");
    if (!b) return;
    b.hidden = false;
    b.textContent = "Ошибка на странице: " + msg + " — обновите страницу (Ctrl/Cmd+Shift+R) и повторите.";
  }
  window.addEventListener("error", function(e){ show((e && e.message) || "неизвестная ошибка"); });
  window.addEventListener("unhandledrejection", function(e){ var r = e && e.reason; show((r && (r.message || r.code)) || String(r)); });
})();
</script>
<script src="core.js?v=2"></script>
<script src="prompts.js?v=3"></script>
<script src="app.js?v=3"></script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
